services:
  mysql:
    image: mysql:8.4
    container_name: petory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-petory}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      # TODO: 로컬 볼륨 대신 관리형 클라우드 DB(RDS 등)로 이전 고려 (데이터를 로컬 디스크에 쌓아두지 않도록)
      - mysql_data:/var/lib/mysql
      # 스키마는 app 기동 시 Flyway(db/migration/V*.sql)가 만든다. initdb 마운트는 사본을 만들 뿐이라 제거함.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # --default-authentication-plugin 은 MySQL 8.4 에서 제거됨. 인증은 기본값(caching_sha2_password)을 쓴다.
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: petory-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nlp-server:
    build:
      context: ./petory-nlp-server
      dockerfile: Dockerfile
    container_name: petory-nlp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - nlp_model_cache:/home/nlp/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petory-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod
      PET_INTENT_BASE_URL: http://nlp-server:8000
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── 모니터링 (로컬 전용, 배포 인프라 아님) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: petory-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: petory-mysqld-exporter
    restart: unless-stopped
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    # 0.15+부터 DATA_SOURCE_NAME 환경변수 지원이 빠져서 .my.cnf 파일 방식으로 인증
    command:
      - |
        cat > /tmp/.my.cnf <<EOF
        [client]
        user=root
        password=$$DB_ROOT_PASSWORD
        host=mysql
        port=3306
        EOF
        exec mysqld_exporter --config.my-cnf=/tmp/.my.cnf
    depends_on:
      mysql:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: petory-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: petory-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  uploads:
  nginx_logs:
  nlp_model_cache:
  grafana_data:
