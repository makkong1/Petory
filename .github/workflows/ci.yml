# GitHub에 코드를 올리거나 PR을 만들었을 때, GitHub 서버가 자동으로 실행할 작업 순서를 적어둔 파일
# main 또는 dev 브랜치에 push되거나, main/dev 브랜치로 Pull Request가 생성/수정되면 실행된다.
#
# MySQL 8.0 + Redis 7 서비스 컨테이너를 띄우고,
# 실제 시크릿이 없는 CI 전용 더미 설정(.github/ci/application-ci.properties)을 사용해,
# 스키마 스냅샷(.github/ci-schema.sql)을 로드한 뒤 전체 테스트(./gradlew test)를 실행한다.
# (설정 파일은 gitignore 되어 CI 체크아웃에 없으므로 런타임에 복사해 넣는다)
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # feat-* → dev, dev → main 등 PR 모두 커버 (main만 두면 dev 대상 PR에서 CI 미실행)
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: petory
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Wait for MySQL and load schema
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pci_root_pw --silent 2>/dev/null; then
              echo "MySQL is up"; break
            fi
            echo "waiting for MySQL... ($i/30)"; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw petory < .github/ci-schema.sql
          echo "loaded tables: $(mysql -h 127.0.0.1 -P 3306 -uroot -pci_root_pw -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='petory';")"

      - name: Prepare CI test config
        run: cp .github/ci/application-ci.properties backend/main/resources/application.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
