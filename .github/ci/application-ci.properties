# CI 전용 테스트 설정 — 실제 시크릿 없음(모두 더미). MySQL/Redis 서비스 컨테이너 대상.
# ci.yml 이 이 파일을 backend/main/resources/application.properties 로 복사해 사용한다.
# 로컬 개발용 application.properties(gitignore)와 무관하며, 로컬 실행에 영향 없음.

# ===== DataSource → MySQL 서비스 컨테이너 =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/petory?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ci_root_pw

# ===== JPA — 스키마는 CI 에서 ci-schema.sql 로 사전 로드 (ddl-auto=none) =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Redis 서비스 컨테이너 (비밀번호 없음) =====
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=2000ms

# ===== JWT (더미) =====
jwt.secret=ci-dummy-jwt-secret-key-0123456789-abcdefghij-0123
jwt.expiration=86400000
jwt.access-token-expiration-ms=900000

# ===== 파일 업로드 =====
file.upload-dir=/tmp/petory-uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===== 메일 (더미) =====
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=ci@example.com
spring.mail.password=ci-dummy
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===== OAuth2 (더미 — ClientRegistrationRepository 빈 생성용, 실제 호출 없음) =====
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback
spring.security.oauth2.client.registration.google.client-id=ci-dummy-google-id
spring.security.oauth2.client.registration.google.client-secret=ci-dummy-google-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.client-id=ci-dummy-naver-id
spring.security.oauth2.client.registration.naver.client-secret=ci-dummy-naver-secret
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===== 앱 설정 (더미/기본) =====
app.frontend.url=http://localhost:3000
app.email-verification.skip-in-dev=false
naver.map.api.client-id=ci-dummy
naver.map.api.client-secret=ci-dummy
app.location.ingest.internal-key=ci-dummy-ingest-key
app.pet-intent.base-url=http://localhost:8000
app.pet-intent.timeout-ms=3000

# ===== 통계 스케줄러 (테스트 중 자동 실행 방지 위해 먼 시각) =====
statistics.scheduler.cron=0 0 4 * * ?

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,prometheus
spring.application.name=Petory

# ===== Spring Boot Admin 클라이언트 비활성 (CI 에 admin 서버 없음) =====
spring.boot.admin.client.enabled=false
